<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team Danjer Kiler AI</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0f;color:#e8e6f0;font-family:'Noto Sans Sinhala',sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.header{background:#0f0f1a;border-bottom:1px solid #1e1e35;padding:14px 20px;display:flex;align-items:center;gap:12px;flex-shrink:0}
.avatar{width:42px;height:42px;border-radius:50%;overflow:hidden;flex-shrink:0;border:2px solid #6c63ff}
.avatar img{width:100%;height:100%;object-fit:cover}
.header-info .name{font-size:14px;font-weight:700;color:#c4b5fd;font-family:'Space Mono',monospace}
.header-info .status{font-size:11px;color:#4ade80;display:flex;align-items:center;gap:5px}
.status-dot{width:6px;height:6px;background:#4ade80;border-radius:50%;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
.chat-area{flex:1;overflow-y:auto;padding:20px 16px;display:flex;flex-direction:column;gap:16px;scroll-behavior:smooth}
.chat-area::-webkit-scrollbar{width:4px}
.chat-area::-webkit-scrollbar-thumb{background:#2a2a45;border-radius:4px}
.msg-row{display:flex;gap:10px;animation:fadeIn 0.3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.msg-row.user{flex-direction:row-reverse}
.msg-avatar{width:32px;height:32px;border-radius:50%;overflow:hidden;flex-shrink:0;margin-top:2px;border:1.5px solid #3a3a60}
.msg-avatar img{width:100%;height:100%;object-fit:cover}
.msg-avatar.user-av{background:#1e1e35;display:flex;align-items:center;justify-content:center;font-size:14px;border:1.5px solid #3a3a60}
.bubble{max-width:78%;padding:10px 14px;border-radius:16px;font-size:14px;line-height:1.7;word-break:break-word}
.bubble.bot{background:#1a1a2e;border:1px solid #2a2a45;color:#e8e6f0;border-bottom-left-radius:4px}
.bubble.user{background:linear-gradient(135deg,#6c63ff,#5b52e0);color:#fff;border-bottom-right-radius:4px}
.typing-bubble{background:#1a1a2e;border:1px solid #2a2a45;padding:12px 16px;border-radius:16px;border-bottom-left-radius:4px;display:flex;gap:5px;align-items:center}
.typing-bubble span{width:7px;height:7px;background:#6c63ff;border-radius:50%;animation:bounce 1.2s infinite}
.typing-bubble span:nth-child(2){animation-delay:0.2s}
.typing-bubble span:nth-child(3){animation-delay:0.4s}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:0.5}30%{transform:translateY(-6px);opacity:1}}
.quick-replies{display:flex;flex-wrap:wrap;gap:8px;padding:0 16px 12px;flex-shrink:0}
.qr-btn{background:#1a1a2e;border:1px solid #2a2a45;color:#a78bfa;padding:6px 13px;border-radius:20px;font-size:12px;cursor:pointer;font-family:inherit;transition:all 0.2s;white-space:nowrap}
.qr-btn:hover{background:#2a2a45;border-color:#6c63ff;color:#c4b5fd}
.input-area{background:#0f0f1a;border-top:1px solid #1e1e35;padding:14px 16px;display:flex;gap:10px;align-items:flex-end;flex-shrink:0}
textarea{flex:1;background:#1a1a2e;border:1px solid #2a2a45;color:#e8e6f0;padding:10px 14px;border-radius:22px;font-size:14px;font-family:inherit;resize:none;outline:none;line-height:1.5;max-height:120px;min-height:44px;transition:border-color 0.2s}
textarea:focus{border-color:#6c63ff}
textarea::placeholder{color:#4a4a70}
.send-btn{width:44px;height:44px;background:linear-gradient(135deg,#6c63ff,#5b52e0);border:none;border-radius:50%;color:white;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:transform 0.15s,opacity 0.15s}
.send-btn:hover{transform:scale(1.07)}
.send-btn:active{transform:scale(0.95)}
.send-btn:disabled{opacity:0.4;cursor:not-allowed;transform:none}
.by-line{text-align:center;font-size:10px;color:#3a3a60;padding-bottom:6px;font-family:'Space Mono',monospace}
</style>
</head>
<body>

<div class="header">
  <div class="avatar"><img id="logo-header" alt="logo"></div>
  <div class="header-info">
    <div class="name">Team Danjer Kiler AI</div>
    <div class="status"><span class="status-dot"></span> Online &middot; by Mathra Quotes</div>
  </div>
</div>

<div class="chat-area" id="chat"></div>

<div class="quick-replies" id="quick-replies">
  <button class="qr-btn" onclick="sendQuick('Caption දෙන්න')">✍️ Caption</button>
  <button class="qr-btn" onclick="sendQuick('Code help කරන්න')">💻 Code</button>
  <button class="qr-btn" onclick="sendQuick('Business idea දෙන්න')">💼 Business</button>
  <button class="qr-btn" onclick="sendQuick('Sinhala quote දෙන්න')">💬 Quote</button>
  <button class="qr-btn" onclick="sendQuick('AI ගැන කියන්න')">🤖 AI</button>
</div>

<div class="input-area">
  <textarea id="input" placeholder="ඔබේ ප්‍රශ්නය මෙහි type කරන්න..." rows="1"></textarea>
  <button class="send-btn" id="send-btn" onclick="sendMessage()">&#x27A4;</button>
</div>
<div class="by-line">Team Danjer Kiler AI v1.0 &middot; Mathra Quotes</div>

var GEMINI_API_KEY = "AQ.Ab8RN6Kzr-DJvj-jPBCCWiavYNJLeORILM8vYFeCK-u66spzog";

document.getElementById('logo-header').src = LOGO;

var SYSTEM_PROMPT = "You are Team Danjer Kiler AI, created by Mathra Quotes. You are a smart, friendly AI assistant who speaks Sinhala, English, and mixed Sinhala-English naturally. Rules: 1) Always reply in the same language the user uses - if Sinhala or mixed Sinhala-English, reply in Sinhala. 2) Be friendly, concise, and helpful. 3) For captions/quotes, give creative stylish Sinhala content. 4) For coding, give working code with brief explanation. 5) Use emojis naturally. 6) You understand Sri Lankan slang and culture. 7) Never say you are Gemini or made by Google. You are Team Danjer Kiler AI by Mathra Quotes.";

var history = [];
var busy = false;

var chat = document.getElementById('chat');
var input = document.getElementById('input');
var sendBtn = document.getElementById('send-btn');

function makeBotAvatar(){
  var av = document.createElement('div');
  av.className = 'msg-avatar';
  var img = document.createElement('img');
  img.src = LOGO;
  img.alt = 'bot';
  av.appendChild(img);
  return av;
}

function makeUserAvatar(){
  var av = document.createElement('div');
  av.className = 'msg-avatar user-av';
  av.textContent = '👤';
  return av;
}

function addMsg(text, role){
  var row = document.createElement('div');
  row.className = 'msg-row' + (role === 'user' ? ' user' : '');
  var av = role === 'user' ? makeUserAvatar() : makeBotAvatar();
  var bubble = document.createElement('div');
  bubble.className = 'bubble ' + role;
  bubble.innerHTML = text.replace(/\n/g,'<br>');
  row.appendChild(av);
  row.appendChild(bubble);
  chat.appendChild(row);
  chat.scrollTop = chat.scrollHeight;
}

function showTyping(){
  var row = document.createElement('div');
  row.className = 'msg-row';
  row.id = 'typing-row';
  var av = makeBotAvatar();
  var t = document.createElement('div');
  t.className = 'typing-bubble';
  t.innerHTML = '<span></span><span></span><span></span>';
  row.appendChild(av);
  row.appendChild(t);
  chat.appendChild(row);
  chat.scrollTop = chat.scrollHeight;
}

function removeTyping(){
  var t = document.getElementById('typing-row');
  if(t) t.remove();
}

async function sendMessage(){
  var text = input.value.trim();
  if(!text || busy) return;
  busy = true;
  sendBtn.disabled = true;
  input.value = '';
  input.style.height = 'auto';
  document.getElementById('quick-replies').style.display = 'none';
  addMsg(text, 'user');

  // Build Gemini conversation history
  var contents = [{role:'user', parts:[{text: SYSTEM_PROMPT + "\n\nUser: " + text}]}];
  if(history.length > 0){
    contents = [];
    for(var i = 0; i < history.length; i++){
      contents.push({
        role: history[i].role === 'user' ? 'user' : 'model',
        parts: [{text: history[i].text}]
      });
    }
    contents.push({role:'user', parts:[{text: text}]});
    // Add system prompt to first message
    if(contents.length > 0 && contents[0].role === 'user'){
      contents[0].parts[0].text = SYSTEM_PROMPT + "\n\n" + contents[0].parts[0].text;
    }
  }

  history.push({role:'user', text: text});
  showTyping();

  try{
    var url = 'https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=' + GEMINI_API_KEY;
    var res = await fetch(url, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({contents: contents})
    });
    var data = await res.json();
    removeTyping();

    if(data.error){
      addMsg('❌ Error: ' + data.error.message, 'bot');
    } else {
      var reply = data.candidates[0].content.parts[0].text || 'කනගාටුයි, error එකක් ආවා.';
      // Clean markdown bold
      reply = reply.replace(/\*\*(.*?)\*\*/g, '$1').replace(/\*(.*?)\*/g, '$1');
      addMsg(reply, 'bot');
      history.push({role:'model', text: reply});
    }
  } catch(e){
    removeTyping();
    addMsg('⚠️ Connection error. Internet check කරලා retry කරන්න.', 'bot');
  }

  busy = false;
  sendBtn.disabled = false;
  input.focus();
}

function sendQuick(text){
  input.value = text;
  sendMessage();
}

input.addEventListener('keydown', function(e){
  if(e.key === 'Enter' && !e.shiftKey){e.preventDefault(); sendMessage();}
});

input.addEventListener('input', function(){
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight,120) + 'px';
});

setTimeout(function(){
  addMsg('👋 ආයුබෝවන්! මම Team Danjer Kiler AI.\n\nCaption, Quote, Code, Business — ඕනෑම දෙයක් අහන්න 😊', 'bot');
}, 300);
</script>
